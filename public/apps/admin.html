<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/assets/base.css"><script src="/assets/core.js"></script>
<title>Verwaltung</title>
<style>
  .u { display:grid; grid-template-columns: 44px 1.3fr 2fr auto; gap: 14px; align-items:center; padding: 14px 4px; border-bottom: 1px solid var(--line); }
  .u:last-child { border: 0; }
  .av { width: 40px; height: 40px; border-radius: 11px; display:grid; place-items:center; font: 700 16px var(--f-display); background: var(--bg); border: 1px solid var(--line2); }
  .av.owner { border-color: var(--acc); color: var(--acc); }
  .apps { display:flex; flex-wrap: wrap; gap: 4px; } .apps .chip { font-size: 11px; padding: 1px 7px; }
  .appgrid { display:grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
  .appgrid label { display:flex; gap: 8px; align-items:center; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; cursor:pointer; font-size: 13px; }
  .appgrid label:has(input:checked) { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 8%, var(--bg)); }
  .appgrid label:has(input:disabled) { opacity: .55; cursor: default; }
  .allrow { display:flex; gap: 12px; align-items:center; padding: 12px 14px; border: 1px solid var(--line2); border-radius: 10px; cursor: pointer; margin-bottom: 8px; background: var(--bg); }
  .allrow input { width: 20px; height: 20px; } .allrow:has(input:checked) { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 12%, var(--bg)); }
  .log { font: 12.5px/1.5 var(--f-mono); } .log .it { gap: 14px; padding: 7px 2px; }
  .log .ev { min-width: 170px; } .ev.bad { color: var(--bad); }
  dialog { width: min(760px, 94vw); max-height: 92vh; }
  @media (max-width: 800px) { .u { grid-template-columns: 44px 1fr; } .u > :nth-child(n+3) { grid-column: 1 / -1; } }
</style>
</head><body>
<main class="wrap">
  <div class="page-head">
    <div><div class="label">Admin</div><h1>Verwaltung</h1><p>Nutzer anlegen und festlegen, welche Seiten sie sehen. Jede Seite prüft das serverseitig, auch Direktlinks und API-Aufrufe.</p></div>
    <div class="row"><div class="tabs" id="tabs"><button class="on" data-t="users">Nutzer</button><button data-t="log">Protokoll</button></div><button class="primary" id="add">+ Nutzer</button></div>
  </div>
  <section id="t-users"><div class="g4" id="kpis" style="margin-bottom:14px"></div><div class="panel" id="list"></div></section>
  <section id="t-log" class="hide"><div class="panel"><div class="panel-h"><span class="label">Letzte Ereignisse</span><div class="row"><button class="chip on" data-lf="">Alle</button><button class="chip" data-lf="fehler">Fehlversuche</button><button class="chip" data-lf="nutzer">Nutzer</button></div></div><div class="list log" id="log"></div></div></section>
</main>
<dialog id="dlg"><form method="dialog" class="stack" id="f">
  <div class="row between"><h3 id="dT">Nutzer</h3><span class="chip" id="dBadge"></span></div>
  <div class="fields"><label class="field"><span>Nutzername</span><input name="uname" autocomplete="off" autocapitalize="off" spellcheck="false" pattern="[a-zA-Z0-9._\-]{2,32}"></label>
    <label class="field"><span id="pwL">Startpasswort</span><div class="row" style="flex-wrap:nowrap"><input name="pass" autocomplete="new-password" spellcheck="false" class="mono"><button type="button" class="sm" id="genPw" title="Sicheres Passwort erzeugen">⟳</button></div></label></div>
  <div><div class="row between" style="margin-bottom:8px"><span class="label">Zugriff auf Seiten</span><div class="row" style="gap:4px"><button type="button" class="chip" data-pre="none">Keine</button><button type="button" class="chip" data-pre="alltag">Alltag</button><button type="button" class="chip" data-pre="lernen">Lernen</button><button type="button" class="chip" data-pre="chat">Nur Messenger</button></div></div>
    <label class="allrow"><input type="checkbox" id="allBox"><span class="grow"><b>Alles freigeben</b><br><span class="faint" style="font-size:12px" id="allHint"></span></span></label>
    <div class="appgrid" id="appgrid"></div>
    <div class="appgrid" style="margin-top:6px;grid-template-columns:1fr"><label><input type="checkbox" name="cockpit"><span>Cockpit auf der Startseite <span class="faint">(Server-Anzeigen links und rechts)</span></span></label></div></div>
  <div class="fields">
    <label class="field"><span>Zugang gültig bis (leer = unbegrenzt)</span><input type="date" name="expires"></label>
    <label class="field"><span>Automatisch abmelden nach Inaktivität</span><select name="sessionHours"><option value="0">Nie (angemeldet bleiben)</option><option value="1">1 Stunde</option><option value="4">4 Stunden</option><option value="12">12 Stunden</option><option value="24">1 Tag</option><option value="168">7 Tage</option><option value="720">30 Tage</option></select></label></div>
  <div class="stack" style="gap:8px">
    <label class="row" style="gap:10px"><input type="checkbox" name="active"> Aktiv (kann sich anmelden)</label>
    <label class="row" style="gap:10px"><input type="checkbox" name="mustChange"> Muss beim nächsten Login ein eigenes Passwort setzen</label>
    <label class="row" style="gap:10px"><input type="checkbox" name="require2fa"> <span>Muss Zwei-Faktor benutzen <span class="faint" id="tfaHint"></span></span></label>
    <label class="row" style="gap:10px" id="adminRow"><input type="checkbox" name="admin"> Admin: darf Nutzer verwalten (nur Owner kann das vergeben)</label></div>
  <div class="row sunk hide" id="dName"><span class="grow" style="font-size:13px">Selbst gewählter Name: <b id="dNameV"></b></span><button type="button" class="sm" data-act="name">Entfernen</button></div>
  <label class="field"><span>Notiz (nur für Admins sichtbar)</span><input name="note" placeholder="z. B. Bruder, Laptop im Wohnzimmer"></label>
  <div class="row" id="dActions"></div>
  <div class="row end"><button value="cancel" class="ghost" formnovalidate>Abbrechen</button><button value="ok" class="primary">Speichern</button></div>
</form></dialog>
<script>
WB.header('admin');
const { $, $$, esc, api, toast, APPS } = WB;
let me, U = [], appIds = [], edit = null, lf = '', req2fa = false;
// Admins brauchen 2FA immer: Häkchen fest gesetzt
function sync2fa(u) { const f = $('#f'), forced = !!(u?.owner || f.admin.checked); f.require2fa.disabled = forced; f.require2fa.checked = forced || req2fa; $('#tfaHint').textContent = forced ? '(Admins immer)' : ''; }
$('#f').addEventListener('change', e => { const t = e.target; if (t.name === 'require2fa') req2fa = t.checked; if (t.name === 'admin') sync2fa(edit);
  if (t.id === 'allBox') boxes().filter(i => !i.disabled).forEach(i => i.checked = t.checked); syncAll(); });
const PRE = { alltag: ['finanzen','abos','kueche','gewohnheiten','countdown','notizen','fokus'], lernen: ['lernen','erklaert','tippen','notizen','fokus'], chat: ['messenger'] };
const appName = id => (APPS.find(a => a.id === id) || { t: id }).t;
async function load() { const r = await api('/api/admin/users'); U = r.users; appIds = r.apps; render(); }
function render() {
  const act = U.filter(u => u.active).length, on = U.reduce((s, u) => s + u.sessions, 0);
  $('#kpis').innerHTML = `<div class="panel stat"><div class="label">Nutzer</div><div class="v">${U.length}</div></div><div class="panel stat"><div class="label">Aktiv</div><div class="v good">${act}</div></div>
    <div class="panel stat"><div class="label">Offene Sitzungen</div><div class="v">${on}</div></div><div class="panel stat"><div class="label">Mit 2FA</div><div class="v acc">${U.filter(u => u.totp).length}</div></div>`;
  $('#list').innerHTML = U.map(u => `<div class="u"><span class="av ${u.owner ? 'owner' : ''}">${esc(u.name[0].toUpperCase())}</span>
    <div><b>${esc(u.name)}</b> ${u.display ? `<span class="mute" style="font-size:13px">nennt sich „${esc(u.display)}“</span>` : ''} ${u.owner ? '<span class="chip on">Owner</span>' : u.admin ? '<span class="chip on">Admin</span>' : ''} ${u.setup2fa ? '<span class="chip warn">2FA fehlt noch</span>' : u.require2fa ? '<span class="chip">2FA Pflicht</span>' : ''} ${!u.active ? '<span class="chip bad">deaktiviert</span>' : ''} ${u.mustChange ? '<span class="chip warn">PW-Wechsel offen</span>' : ''}
      <div class="faint" style="font-size:12px">${u.lastLogin ? 'zuletzt ' + new Date(u.lastLogin).toLocaleString('de-DE') : 'noch nie angemeldet'} · ${u.sessions} Sitzung(en)${u.totp ? ' · 2FA' : ''}${u.expires ? ' · bis ' + new Date(u.expires).toLocaleDateString('de-DE') : ''}${u.note ? ' · ' + esc(u.note) : ''}</div></div>
    <div class="apps">${u.owner ? '<span class="chip on">alle Seiten</span>' : u.apps.length ? u.apps.map(a => `<span class="chip">${esc(appName(a))}</span>`).join('') : '<span class="faint" style="font-size:12px">keine Seiten</span>'}</div>
    <div class="row"><button class="sm" data-edit="${u.id}">Bearbeiten</button></div></div>`).join('');
}
const ADMIN_ONLY = ['protokoll', 'docker', 'wartung', 'geraete'];
function grid(sel) { $('#appgrid').innerHTML = appIds.map(a => `<label><input type="checkbox" value="${a}" ${sel.includes(a) ? 'checked' : ''}><span>${esc(appName(a))}${ADMIN_ONLY.includes(a) ? ' <span class="faint">· nur Admins</span>' : ''}</span></label>`).join(''); }
// Server- und Netz-Seiten gibt es nur für Admins; „Alles freigeben“ hakt an, was für dieses Konto möglich ist
const boxes = () => [...$$('#appgrid input'), $('#f').cockpit];
function syncAll() {
  const f = $('#f'), owner = !!edit?.owner, admin = owner || f.admin.checked;
  $$('#appgrid input').forEach(i => { const only = !admin && ADMIN_ONLY.includes(i.value); i.disabled = owner || only; if (only) i.checked = false; });
  const open = boxes().filter(i => !i.disabled), n = open.filter(i => i.checked).length, all = $('#allBox');
  all.disabled = owner; all.checked = owner || (open.length > 0 && n === open.length); all.indeterminate = !owner && n > 0 && n < open.length;
  $('#allHint').textContent = owner ? 'Der Owner darf immer alles.' : `${n} von ${open.length} freigegeben${admin ? '' : ' · Seiten nur für Admins zählen nicht mit'}`;
}
const genPw = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; const a = crypto.getRandomValues(new Uint32Array(16)); return [...a].map(x => c[x % c.length]).join('').match(/.{4}/g).join('-'); };
function open(u) {
  edit = u || null; const f = $('#f'); f.reset();
  $('#dT').textContent = u ? u.name : 'Neuer Nutzer'; $('#dBadge').textContent = u ? (u.owner ? 'Owner' : u.admin ? 'Admin' : 'Nutzer') : 'neu';
  f.uname.value = u ? u.name : ''; f.uname.disabled = !!u; f.uname.required = !u;
  $('#pwL').textContent = u ? 'Neues Passwort setzen (leer = unverändert)' : 'Startpasswort'; f.pass.required = !u; f.pass.value = u ? '' : genPw();
  grid(u ? (u.owner ? appIds : u.apps) : []); f.cockpit.checked = u ? u.cockpit : true; f.cockpit.disabled = !!u?.owner;
  f.expires.value = u?.expires || ''; f.sessionHours.value = String(u?.sessionHours ?? 0);
  $('#dName').classList.toggle('hide', !u?.display); $('#dNameV').textContent = u?.display || '';
  f.active.checked = u ? u.active : true; f.mustChange.checked = u ? u.mustChange : true; f.admin.checked = !!u?.admin;
  req2fa = !!u?.require2fa && !u.admin; sync2fa(u); syncAll();
  f.active.disabled = f.admin.disabled = !!u?.owner || u?.id === me.id; $('#adminRow').classList.toggle('hide', !me.owner);
  f.expires.disabled = !!u?.owner;
  $('#dActions').innerHTML = u ? `<button type="button" class="sm" data-act="logout">Überall abmelden</button>${u.totp ? '<button type="button" class="sm" data-act="2fa">2FA zurücksetzen</button>' : ''}${u.owner || u.id === me.id ? '' : '<span class="grow"></span><button type="button" class="sm danger" data-act="del">Nutzer löschen</button>'}` : '';
  $('#dlg').showModal();
}
$('#add').onclick = () => open();
$('#genPw').onclick = () => { $('#f').pass.value = genPw(); };
$('#f').addEventListener('click', async e => { const p = e.target.closest('[data-pre]'); if (p) { const v = p.dataset.pre; $$('#appgrid input').forEach(i => i.checked = v === 'all' ? true : v === 'none' ? false : PRE[v].includes(i.value)); syncAll(); }
  const a = e.target.closest('[data-act]'); if (!a || !edit) return;
  try { if (a.dataset.act === 'logout') { await api(`/api/admin/users/${edit.id}/logout`, { method: 'POST' }); toast(edit.name + ' wurde überall abgemeldet'); }
    if (a.dataset.act === 'name') { await api('/api/admin/users/' + edit.id, { method: 'PUT', body: { display: '' } }); $('#dName').classList.add('hide'); toast('Name entfernt'); }
    if (a.dataset.act === '2fa' && confirm('2FA für ' + edit.name + ' zurücksetzen?')) { await api(`/api/admin/users/${edit.id}/reset-2fa`, { method: 'POST' }); toast('2FA zurückgesetzt'); }
    if (a.dataset.act === 'del' && confirm(`${edit.name} und alle Daten (inkl. Nachrichten) endgültig löschen? Das kann nicht rückgängig gemacht werden.`)) { await api(`/api/admin/users/${edit.id}`, { method: 'DELETE' }); $('#dlg').close('x'); toast('Gelöscht'); }
    load(); } catch (err) { toast(err.message); } });
$('#dlg').addEventListener('close', async () => { if ($('#dlg').returnValue !== 'ok') return; const f = $('#f');
  const body = { apps: $$('#appgrid input:checked').map(i => i.value), expires: f.expires.value || null, sessionHours: +f.sessionHours.value, active: f.active.checked, mustChange: f.mustChange.checked, note: f.note.value }; if (!f.cockpit.disabled) body.cockpit = f.cockpit.checked;
  if (me.owner) body.admin = f.admin.checked; if (!f.require2fa.disabled) body.require2fa = f.require2fa.checked; if (f.pass.value) body.pass = f.pass.value;
  const pw = f.pass.value;
  try { if (edit) { if (pw && !confirm('Passwort zurücksetzen? Der Messenger-Tresor dieses Nutzers wird dabei gelöscht, alte Nachrichten sind für ihn dann nicht mehr lesbar.')) return; await api('/api/admin/users/' + edit.id, { method: 'PUT', body }); toast('Gespeichert'); }
    else { body.name = f.uname.value; await api('/api/admin/users', { method: 'POST', body }); }
    if (pw) { try { await navigator.clipboard.writeText(pw); toast('Gespeichert. Passwort ist in der Zwischenablage, gib es sicher weiter.'); } catch { alert('Passwort für die Weitergabe: ' + pw); } }
    load(); } catch (err) { toast(err.message); $('#dlg').showModal(); } });
document.addEventListener('click', e => { const b = e.target.closest('[data-edit]'); if (b) open(U.find(u => u.id === b.dataset.edit));
  const l = e.target.closest('[data-lf]'); if (l) { lf = l.dataset.lf; $$('[data-lf]').forEach(x => x.classList.toggle('on', x === l)); log(); } });
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; $$('#tabs button').forEach(x => x.classList.toggle('on', x === b)); ['users','log'].forEach(t => $('#t-' + t).classList.toggle('hide', t !== b.dataset.t)); if (b.dataset.t === 'log') log(); };
async function log() { const l = (await api('/api/admin/audit')).filter(x => !lf || x.ev.includes(lf) || (lf === 'fehler' && /gesperrt|abgelaufen|deaktiviert/.test(x.ev)));
  $('#log').innerHTML = l.map(x => `<div class="it"><span class="faint">${new Date(x.t).toLocaleString('de-DE')}</span><span class="ev ${/fehler|gesperrt/.test(x.ev) ? 'bad' : ''}">${esc(x.ev)}</span><span>${esc(x.user)}</span><span class="faint">${esc(x.ip)}</span><span class="mute">${esc(x.detail)}</span></div>`).join('') || '<div class="faint">Nichts</div>'; }
(async () => { me = await WB.me(); load(); })();
</script>
</body></html>
