<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/assets/base.css"><script src="/assets/core.js"></script>
<title>Dienste-Monitor</title>
<style>
  .svc { display:grid; grid-template-columns: 14px minmax(0,1.3fr) minmax(0,1.2fr) 90px 80px auto; gap: 14px; align-items:center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .svc:last-child { border-bottom: 0; }
  .st { width: 12px; height: 12px; border-radius: 50%; background: var(--faint); }
  .st.up { background: var(--good); box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 20%, transparent); }
  .st.down { background: var(--bad); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 22%, transparent); animation: pulse 1.6s infinite; }
  .st.warn { background: var(--warn); }
  @media (max-width: 600px) { .svc { grid-template-columns: 14px minmax(0,1fr) auto; gap: 8px 12px; } .svc > :nth-child(3) { grid-column: 2 / -1; grid-row: 2; min-width: 0; overflow-wrap: anywhere; } .svc > .ms, .svc > .up { display: none; } }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--bad) 5%, transparent); } }
  .svc b { display:block; font-size: 14px; } .svc .t { font: 12px var(--f-mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spark { display:flex; align-items:end; gap: 1px; height: 26px; }
  .spark i { flex: 1; min-width: 2px; max-width: 7px; background: var(--good); border-radius: 1px; opacity: .8; } .spark i.d { background: var(--bad); height: 100% !important; opacity: .9; }
  .ms { font: 600 13px var(--f-mono); text-align: right; } .up { font: 12px var(--f-mono); color: var(--mute); text-align: right; }
  .grp { font: 600 12px var(--f-mono); color: var(--mute); letter-spacing: .1em; text-transform: uppercase; margin: 18px 4px 4px; }
  @media (max-width: 800px) { .svc { grid-template-columns: 14px 1fr auto; } .svc .spark, .svc .up { display:none; } }
</style>
</head><body>
<main class="wrap">
  <div class="page-head">
    <div><div class="label">Technik</div><h1>Dienste-Monitor</h1><p>Der Server prüft jede Minute, ob deine Geräte und Dienste erreichbar sind: Webseiten (HTTP), Ports (TCP) und HTTPS-Zertifikate mit Ablaufwarnung. Ausfälle erscheinen auf der Startseite.</p></div>
    <div class="row"><button id="check">Jetzt prüfen</button><button class="primary hide" id="add">+ Dienst</button></div>
  </div>
  <div class="g4" id="kpis" style="margin-bottom:14px"></div>
  <div class="panel" id="list"></div>
  <div class="panel hide" id="presets" style="margin-top:14px"><div class="label" style="margin-bottom:10px">Schnell hinzufügen</div><div class="row" id="pre" style="gap:6px"></div></div>
</main>
<dialog id="dlg"><form method="dialog" class="stack" id="f">
  <h3 id="dT">Dienst</h3>
  <div class="fields"><label class="field"><span>Name</span><input name="nm" required placeholder="z. B. Router"></label><label class="field"><span>Gruppe</span><input name="grp" placeholder="z. B. Zuhause"></label></div>
  <label class="field"><span>Art der Prüfung</span><select name="type"><option value="http">Webseite / HTTP(S)-Adresse</option><option value="tcp">Port erreichbar (TCP)</option><option value="tls">HTTPS-Zertifikat (Ablauf)</option></select></label>
  <label class="field"><span id="tL">Adresse</span><input name="target" required></label>
  <label class="field" id="wdF"><span>Warnen, wenn das Zertifikat in weniger als … Tagen abläuft</span><input name="warn" type="number" min="1" max="90" value="14"></label>
  <div class="row"><button type="button" class="danger ghost hide" id="del">Löschen</button><span class="grow"></span><button value="cancel" class="ghost" formnovalidate>Abbrechen</button><button value="ok" class="primary">Speichern</button></div>
</form></dialog>
<script>
WB.header('monitor');
const { $, $$, esc, api, toast } = WB;
let me, M = { targets: [], state: {} }, edit = null;
const PH = { http: 'https://example.com oder http://192.168.178.1', tcp: 'host:port, z. B. 192.168.178.5:53', tls: 'domain:443, z. B. github.com:443' };
const PRE = [['Internet (Cloudflare DNS)', 'tcp', '1.1.1.1:53', 'Internet'], ['Google erreichbar', 'http', 'https://www.google.com', 'Internet'], ['Fritz!Box', 'http', 'http://fritz.box', 'Zuhause'], ['Pi-hole DNS', 'tcp', 'pi.hole:53', 'Zuhause'], ['GitHub-Zertifikat', 'tls', 'github.com:443', 'Zertifikate']];
const dur = ms => { const m = Math.floor(ms / 60000); return m < 60 ? m + ' Min' : m < 1440 ? Math.floor(m / 60) + ' Std' : Math.floor(m / 1440) + ' Tage'; };
function render() {
  const T = M.targets, S = M.state, up = T.filter(t => S[t.id]?.up).length, down = T.filter(t => S[t.id] && S[t.id].up === false).length, warn = T.filter(t => S[t.id]?.warn).length;
  const avg = T.map(t => S[t.id]?.ms).filter(Boolean);
  $('#kpis').innerHTML = `<div class="panel stat"><div class="label">Online</div><div class="v good">${up}/${T.length}</div></div><div class="panel stat"><div class="label">Ausgefallen</div><div class="v ${down ? 'bad' : ''}">${down}</div></div>
    <div class="panel stat"><div class="label">Zertifikats-Warnungen</div><div class="v ${warn ? 'warn' : ''}">${warn}</div></div><div class="panel stat"><div class="label">Ø Antwortzeit</div><div class="v">${avg.length ? Math.round(avg.reduce((a, b) => a + b) / avg.length) + ' ms' : '–'}</div></div>`;
  const groups = [...new Set(T.map(t => t.group || 'Allgemein'))];
  $('#list').innerHTML = T.length ? groups.map(g => `<div class="grp">${esc(g)}</div>` + T.filter(t => (t.group || 'Allgemein') === g).map(t => { const s = S[t.id] || {}; const h = s.hist || [];
    const mx = Math.max(10, ...h.filter(x => x > 0)); const upPct = h.length ? Math.round(h.filter(x => x > 0).length / h.length * 100) : null;
    return `<div class="svc"><span class="st ${s.up === true ? (s.warn ? 'warn' : 'up') : s.up === false ? 'down' : ''}"></span>
      <div><b>${esc(t.name)}</b><div class="t">${esc({ http: 'HTTP', tcp: 'TCP', tls: 'Zertifikat' }[t.type])} · ${esc(t.target)}</div></div>
      <div><div class="spark">${h.slice(-60).map(x => x < 0 ? '<i class="d"></i>' : `<i style="height:${Math.max(12, x / mx * 100)}%"></i>`).join('')}</div>
        <div class="faint" style="font-size:11px;margin-top:3px">${s.up === false ? `<span class="bad">offline seit ${dur(Date.now() - s.since)}: ${esc(s.error || 'Fehler ' + (s.code || ''))}</span>` : s.warn ? `<span class="warn">${esc(s.warn)}</span>` : s.since ? 'online seit ' + dur(Date.now() - s.since) : 'noch nicht geprüft'}${t.type === 'tls' && s.days != null ? ' · noch ' + s.days + ' Tage gültig' : ''}</div></div>
      <div class="ms">${s.up && s.ms ? s.ms + ' ms' : '–'}</div><div class="up">${upPct != null ? upPct + ' %' : ''}</div>
      <div>${me.admin ? `<button class="ghost sm" data-edit="${t.id}" title="Bearbeiten">${WB.icon('edit', 14)}</button>` : ''}</div></div>`; }).join('')).join('')
    : `<div class="empty">Noch keine Dienste. ${me.admin ? 'Füg unten mit einem Klick welche hinzu oder leg eigene an.' : 'Ein Admin kann Dienste hinzufügen.'}</div>`;
  if (me.admin) { $('#presets').classList.remove('hide'); $('#pre').innerHTML = PRE.filter(p => !T.some(t => t.target === p[2])).map((p, i) => `<button class="chip" data-pre="${PRE.indexOf(p)}">+ ${esc(p[0])}</button>`).join('') || '<span class="faint">Alle Vorschläge sind schon drin.</span>'; }
}
async function save(targets) { try { const r = await api('/api/monitor/targets', { method: 'PUT', body: { targets } }); M.targets = r.targets; render(); setTimeout(load, 2500); } catch (e) { toast(e.message); } }
function open(t) { edit = t || null; const f = $('#f'); f.reset(); $('#dT').textContent = t ? 'Dienst bearbeiten' : 'Neuer Dienst'; $('#del').classList.toggle('hide', !t);
  if (t) { f.nm.value = t.name; f.grp.value = t.group || ''; f.type.value = t.type; f.target.value = t.target; f.warn.value = t.warnDays || 14; }
  upd(); $('#dlg').showModal(); }
function upd() { const f = $('#f'); f.target.placeholder = PH[f.type.value]; $('#wdF').classList.toggle('hide', f.type.value !== 'tls'); }
$('#f').type.onchange = upd;
$('#del').onclick = () => { if (!confirm('Dienst entfernen?')) return; $('#dlg').close(); save(M.targets.filter(x => x.id !== edit.id)); };
$('#dlg').addEventListener('close', () => { if ($('#dlg').returnValue !== 'ok') return; const f = $('#f');
  const t = { id: edit?.id, name: f.nm.value.trim(), group: f.grp.value.trim(), type: f.type.value, target: f.target.value.trim(), warnDays: +f.warn.value || 14 };
  if (t.type === 'http' && !/^https?:\/\//.test(t.target)) t.target = 'http://' + t.target;
  save(edit ? M.targets.map(x => x.id === edit.id ? t : x) : [...M.targets, t]); });
document.addEventListener('click', e => { const b = e.target.closest('[data-edit]'); if (b) open(M.targets.find(t => t.id === b.dataset.edit));
  const p = e.target.closest('[data-pre]'); if (p) { const [name, type, target, group] = PRE[+p.dataset.pre]; save([...M.targets, { name, type, target, group }]); } });
$('#add').onclick = () => open();
$('#check').onclick = async () => { $('#check').disabled = true; try { M = await api('/api/monitor/check', { method: 'POST' }); render(); toast('Geprüft'); } catch (e) { toast(e.message); } $('#check').disabled = false; };
async function load() { try { M = await api('/api/monitor'); render(); } catch (e) { toast(e.message); } }
(async () => { me = await WB.me(); $('#add').classList.toggle('hide', !me.admin); await load(); setInterval(load, 30000); setInterval(render, 60000); })();
</script>
</body></html>
