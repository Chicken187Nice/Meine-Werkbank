<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/assets/base.css"><script src="/assets/design.js"></script><script src="/assets/core.js"></script>
<title>Fokus-Timer</title>
<style>
  .dial { position: relative; width: min(420px, calc(80vw / var(--wb-z, 1)), 100%); aspect-ratio: 1; margin: 10px auto; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .dial .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .dial .t { font: 700 clamp(48px, 10vw, 84px)/1 var(--f-mono); letter-spacing: -.03em; }
  .dial .m { font: 600 12px var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--acc); margin-top: 8px; }
  .dots { display:flex; gap: 6px; justify-content:center; } .dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line2); } .dots i.on { background: var(--acc); border-color: var(--acc); }
  .week { display:flex; align-items:end; gap: 8px; height: 110px; } .week div { flex: 1; display:flex; flex-direction:column; align-items:center; gap: 6px; height: 100%; justify-content: end; }
  .week i { width: 100%; max-width: 30px; background: var(--acc); border-radius: 4px 4px 0 0; min-height: 2px; } .week span { font: 11px var(--f-mono); color: var(--mute); }
  body.running .top { opacity: .35; transition: opacity .4s; } body.running .top:hover { opacity: 1; }
</style>
</head><body>
<main class="wrap">
  <div class="page-head">
    <div><div class="label">15 · Werkzeug</div><h1>Fokus-Timer</h1><p>25 Minuten eine Sache, dann 5 Minuten Pause, nach vier Runden eine lange Pause. Schreib vorher auf, woran du arbeitest. Am Ende siehst du, wo deine Zeit hinging.</p></div>
  </div>
  <div class="side">
    <div class="stack">
      <div class="panel stack"><div class="label">Einstellungen (Minuten)</div>
        <div class="fields"><label class="field"><span>Fokus</span><input type="number" id="sF" min="1" max="120"></label><label class="field"><span>Pause</span><input type="number" id="sP" min="1" max="60"></label><label class="field"><span>Lange Pause</span><input type="number" id="sL" min="1" max="60"></label></div>
        <label class="row" style="gap:10px"><input type="checkbox" id="sound"> Ton am Ende</label><label class="row" style="gap:10px"><input type="checkbox" id="auto"> Nächste Phase automatisch starten</label></div>
      <div class="panel"><div class="panel-h"><span class="label">Diese Woche</span><span class="mono mute" id="wsum"></span></div><div class="week" id="week"></div></div>
      <div class="panel"><div class="panel-h"><span class="label">Heute nach Aufgabe</span></div><div class="list" id="byTask"></div></div>
    </div>
    <div class="panel stack" style="text-align:center">
      <input id="task" placeholder="Woran arbeitest du gerade?" style="text-align:center;font-size:16px;max-width:460px;margin:0 auto">
      <div class="dial"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--line)" stroke-width="2"/><circle id="arc" cx="50" cy="50" r="46" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="0"/></svg>
        <div class="c"><div><div class="t" id="t">25:00</div><div class="m" id="m">Fokus</div></div></div></div>
      <div class="dots" id="dots"></div>
      <div class="row" style="justify-content:center"><button class="primary" id="go" style="min-width:140px">Start <span class="kbd" style="color:inherit;border-color:currentColor">Leertaste</span></button><button id="skip">Überspringen</button><button class="ghost" id="rst">Zurücksetzen</button></div>
    </div>
  </div>
</main>
<script>
WB.header('fokus');
const { $, esc, today, ymd, Store, toast } = WB;
let D = { cfg: { f: 25, p: 5, l: 15, sound: true, auto: false }, log: [] };
const save = () => Store.set('fokus', D);
let phase = 'f', round = 0, endAt = 0, left = 0, total = 0, running = false, tick;
const LBL = { f: 'Fokus', p: 'Pause', l: 'Lange Pause' };
function setPhase(p) { phase = p; total = left = D.cfg[p] * 60; running = false; clearInterval(tick); draw(); }
function draw() {
  const s = Math.max(0, Math.ceil(left)); $('#t').textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  $('#m').textContent = LBL[phase]; $('#arc').style.strokeDashoffset = 1000 * (1 - left/total);
  $('#arc').style.stroke = phase === 'f' ? 'var(--acc)' : 'var(--good)';
  $('#go').firstChild.textContent = running ? 'Pause ' : 'Start ';
  $('#dots').innerHTML = [0,1,2,3].map(i => `<i class="${i < round % 4 || (round && round % 4 === 0 && phase === 'l') ? 'on' : ''}"></i>`).join('');
  document.title = running ? `${$('#t').textContent} · ${LBL[phase]}` : 'Fokus-Timer · Werkbank'; document.body.classList.toggle('running', running && phase === 'f');
}
function beep() { if (!D.cfg.sound) return; try { const a = new AudioContext(); [0, .25, .5].forEach((t, i) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = [660, 880, 990][i]; g.gain.setValueAtTime(.0001, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.25, a.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + t + .22); o.connect(g).connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + .25); }); } catch {} }
function finish(skipped) {
  if (phase === 'f' && !skipped) { round++; D.log.push({ d: today(), m: D.cfg.f, task: $('#task').value.trim() || 'Ohne Aufgabe' }); D.log = D.log.filter(x => x.d >= ymd(new Date(Date.now() - 90*864e5))); save(); stats(); }
  if (phase === 'f') { if (skipped) round++; } beep();
  if (!skipped && 'Notification' in window && Notification.permission === 'granted') new Notification(phase === 'f' ? 'Pause!' : 'Weiter geht\'s', { body: phase === 'f' ? 'Steh kurz auf.' : 'Nächste Fokusrunde.' });
  const next = phase === 'f' ? (round % 4 === 0 ? 'l' : 'p') : 'f'; setPhase(next); if (D.cfg.auto && !skipped) start();
}
function start() { running = true; endAt = Date.now() + left * 1000; clearInterval(tick); tick = setInterval(() => { left = (endAt - Date.now()) / 1000; if (left <= 0) { left = 0; draw(); finish(false); } else draw(); }, 250); draw();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }
function pause() { running = false; clearInterval(tick); draw(); }
$('#go').onclick = () => running ? pause() : start();
$('#skip').onclick = () => finish(true);
$('#rst').onclick = () => { round = 0; setPhase('f'); };
document.addEventListener('keydown', e => { if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); running ? pause() : start(); } });
function stats() {
  const days = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const mins = days.map(d => D.log.filter(x => x.d === ymd(d)).reduce((s, x) => s + x.m, 0)); const mx = Math.max(25, ...mins);
  $('#week').innerHTML = days.map((d, i) => `<div title="${mins[i]} Min"><i style="height:${mins[i]/mx*100}%"></i><span>${d.toLocaleDateString('de-DE',{weekday:'short'})}</span></div>`).join('');
  const sum = mins.reduce((a,b)=>a+b,0); $('#wsum').textContent = `${Math.floor(sum/60)} h ${sum%60} min`;
  const by = {}; D.log.filter(x => x.d === today()).forEach(x => by[x.task] = (by[x.task]||0) + x.m);
  $('#byTask').innerHTML = Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([t,m]) => `<div class="it"><span class="grow">${esc(t)}</span><span class="mono">${m} min</span></div>`).join('') || '<div class="faint" style="font-size:13px">Heute noch keine Runde</div>';
}
['sF','sP','sL'].forEach((id, i) => $('#'+id).onchange = e => { D.cfg['fpl'[i]] = Math.max(1, +e.target.value || 1); save(); if (!running) setPhase(phase); });
$('#sound').onchange = e => { D.cfg.sound = e.target.checked; save(); }; $('#auto').onchange = e => { D.cfg.auto = e.target.checked; save(); };
(async () => { D = Object.assign(D, await Store.get('fokus', D)); $('#sF').value = D.cfg.f; $('#sP').value = D.cfg.p; $('#sL').value = D.cfg.l; $('#sound').checked = D.cfg.sound; $('#auto').checked = D.cfg.auto; setPhase('f'); stats(); })();
</script>
</body></html>
