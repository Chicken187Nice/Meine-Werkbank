<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/assets/base.css"><script src="/assets/core.js"></script>
<title>Gewohnheiten</title>
<style>
  .habit { display:grid; grid-template-columns: 1fr auto; gap:14px; padding:16px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--bg); }
  .habit + .habit { margin-top:10px; }
  .days { display:flex; gap:5px; }
  .days button { width:36px; height:42px; padding:0; flex-direction:column; gap:0; font: 600 10px var(--f-mono); color:var(--mute); }
  .days button b { font-size:13px; color:var(--text); }
  .days button.on { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); } .days button.on b { color:var(--acc-ink); }
  .days button.off { opacity:.35; }
  .heat { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 11px); gap:3px; margin-top:12px; overflow:auto; }
  .heat i { width:11px; height:11px; border-radius:2px; background:var(--bg3); display:block; }
  .heat i.on { background:var(--acc); } .heat i.fut { opacity:.25; }
  .streak { font: 700 22px var(--f-mono); }
  .lvl { display:flex; align-items:center; gap:16px; }
  .ring { --p: 0; width:86px; height:86px; border-radius:50%; background: conic-gradient(var(--acc) calc(var(--p)*1%), var(--bg3) 0); display:grid; place-items:center; flex:none; }
  .ring span { width:70px; height:70px; border-radius:50%; background:var(--bg2); display:grid; place-items:center; font: 700 24px var(--f-mono); }
  .badge { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid var(--line2); border-radius:8px; font-size:12px; }
  .badge.got { border-color: var(--acc); color: var(--acc); }
  @media (max-width:640px){ .habit { grid-template-columns:1fr; } }
</style>
</head><body>
<main class="wrap">
  <div class="page-head">
    <div><div class="label">04 · Alltag</div><h1>Gewohnheiten</h1><p>Klein anfangen, jeden Tag abhaken. Jeder Haken bringt Punkte, Serien geben einen Bonus und alle paar Level schaltest du eine eigene Belohnung frei.</p></div>
    <form class="row" id="addF" style="flex-wrap:nowrap"><input id="addIn" placeholder="Neue Gewohnheit, z. B. 20 Min lesen" style="flex:1;min-width:0;width:min(260px,60vw)"><button class="primary">Hinzufügen</button></form>
  </div>
  <div class="side">
    <div class="stack">
      <div class="panel"><div class="label" style="margin-bottom:14px">Fortschritt</div>
        <div class="lvl"><div class="ring" id="ring"><span id="lvl">1</span></div>
          <div><div style="font:600 18px var(--f-display)">Level <span id="lvl2"></span></div><div class="mute mono" style="font-size:13px" id="xp"></div><div class="mute" style="font-size:13px;margin-top:4px" id="todayDone"></div></div></div>
      </div>
      <div class="panel"><div class="panel-h"><span class="label">Belohnungen</span></div>
        <div class="list" id="rewards"></div>
        <form class="row" id="rewF" style="flex-wrap:nowrap;margin-top:10px"><input id="rewLvl" type="number" min="2" value="5" style="width:70px" title="Level"><input id="rewIn" placeholder="z. B. Kino-Abend"><button>+</button></form>
      </div>
      <div class="panel"><div class="panel-h"><span class="label">Abzeichen</span></div><div class="row" id="badges"></div></div>
    </div>
    <div id="list"></div>
  </div>
</main>
<script>
WB.header('gewohnheiten');
const { $, esc, uid, today, ymd, parseYmd, Store, toast } = WB;
let D = { habits: [], rewards: [{ id: 'r1', lvl: 3, text: 'Lieblingsessen bestellen' }] };
const save = () => Store.set('gewohnheiten', D);
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];

function streak(h) {
  let s = 0; const d = new Date(); if (!h.done.includes(today())) d.setDate(d.getDate()-1);
  while (h.done.includes(ymd(d))) { s++; d.setDate(d.getDate()-1); }
  return s;
}
function best(h) { const set = [...h.done].sort(); let b = 0, c = 0, prev = null;
  for (const s of set) { const t = parseYmd(s); c = prev && (t - prev) === 864e5 ? c+1 : 1; b = Math.max(b,c); prev = t; } return b; }
function xp() { let x = 0; for (const h of D.habits) { x += h.done.length * 10; x += Math.floor(best(h) / 7) * 50; } return x; }
const lvlOf = x => Math.floor(Math.sqrt(x / 40)) + 1;
const xpFor = l => (l-1)*(l-1)*40;

function render() {
  const X = xp(), L = lvlOf(X), a = xpFor(L), b = xpFor(L+1);
  $('#lvl').textContent = L; $('#lvl2').textContent = L; $('#ring').style.setProperty('--p', ((X-a)/(b-a)*100).toFixed(0));
  $('#xp').textContent = `${X} XP · noch ${b-X} bis Level ${L+1}`;
  const td = D.habits.filter(h => h.done.includes(today())).length;
  $('#todayDone').textContent = D.habits.length ? `Heute ${td} von ${D.habits.length} erledigt` : '';

  $('#rewards').innerHTML = D.rewards.sort((x,y)=>x.lvl-y.lvl).map(r => `<div class="it"><span class="chip ${L>=r.lvl?'on':''}">Lv ${r.lvl}</span><span class="grow ${L>=r.lvl?'':'mute'}">${esc(r.text)}</span>${L>=r.lvl?'<span class="good" style="font-size:12px">freigeschaltet</span>':''}<button class="ghost sm" data-red="${r.id}" title="Bearbeiten">✎</button><button class="ghost sm" data-rdel="${r.id}">✕</button></div>`).join('') || '<div class="faint">Leg dir Belohnungen fest</div>';

  const maxS = Math.max(0, ...D.habits.map(best)), total = D.habits.reduce((s,h)=>s+h.done.length,0);
  const B = [['Erster Haken', total>=1], ['7er-Serie', maxS>=7], ['30er-Serie', maxS>=30], ['100 Haken', total>=100], ['Perfekter Tag', D.habits.length>1 && td===D.habits.length]];
  $('#badges').innerHTML = B.map(([n,g]) => `<span class="badge ${g?'got':''}">${g?'●':'○'} ${n}</span>`).join('');

  const days = []; for (let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d); }
  $('#list').innerHTML = D.habits.length ? D.habits.map(h => {
    const s = streak(h);
    const cells = []; const start = new Date(); start.setDate(start.getDate() - 7*17 - ((start.getDay()+6)%7));
    for (let i=0;i<7*18;i++){ const d = new Date(start); d.setDate(d.getDate()+i); const k = ymd(d); cells.push(`<i class="${h.done.includes(k)?'on':''} ${d>new Date()?'fut':''}" title="${d.toLocaleDateString('de-DE')}"></i>`); }
    return `<div class="habit"><div><div class="row"><b style="font-size:16px">${esc(h.name)}</b><button class="ghost sm" data-ed="${h.id}" title="Umbenennen">✎</button><button class="ghost sm danger" data-del="${h.id}">✕</button></div>
      <div class="mute" style="font-size:13px">Beste Serie ${best(h)} · insgesamt ${h.done.length}×</div>
      <div class="heat">${cells.join('')}</div></div>
      <div class="stack" style="text-align:right"><div><span class="streak ${s?'acc':'faint'}">${s}</span> <span class="mute" style="font-size:13px">Tage Serie</span></div>
      <div class="days">${days.map(d => { const k = ymd(d); return `<button class="${h.done.includes(k)?'on':''}" data-h="${h.id}" data-d="${k}">${WD[d.getDay()]}<b>${d.getDate()}</b></button>`; }).join('')}</div></div></div>`;
  }).join('') : '<div class="empty">Leg deine erste Gewohnheit an. Lieber klein und täglich als groß und selten.</div>';
}

$('#addF').onsubmit = e => { e.preventDefault(); const v = $('#addIn').value.trim(); if (!v) return; D.habits.push({ id: uid(), name: v, done: [] }); $('#addIn').value=''; save(); render(); };
$('#rewF').onsubmit = e => { e.preventDefault(); const v = $('#rewIn').value.trim(); if (!v) return; D.rewards.push({ id: uid(), lvl: +$('#rewLvl').value||2, text: v }); $('#rewIn').value=''; save(); render(); };
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.h) { const h = D.habits.find(x => x.id === b.dataset.h); const k = b.dataset.d; const before = lvlOf(xp());
    h.done = h.done.includes(k) ? h.done.filter(x => x!==k) : [...h.done, k]; save(); render();
    const after = lvlOf(xp()); if (after > before) { const r = D.rewards.find(r => r.lvl === after); toast(`Level ${after}!` + (r ? ' Belohnung: ' + r.text : '')); } }
  if (b.dataset.del && confirm('Gewohnheit löschen?')) { D.habits = D.habits.filter(x => x.id !== b.dataset.del); save(); render(); }
  if (b.dataset.ed) { const h = D.habits.find(x => x.id === b.dataset.ed); WB.editForm('Gewohnheit bearbeiten', [{ k: 'name', l: 'Name', v: h.name, req: true }]).then(v => { if (v && v !== 'delete') { h.name = v.name; save(); render(); } }); }
  if (b.dataset.red) { const r = D.rewards.find(x => x.id === b.dataset.red); WB.editForm('Belohnung bearbeiten', [{ k: 'text', l: 'Belohnung', v: r.text, req: true }, { k: 'lvl', l: 'Ab Level', type: 'number', v: r.lvl }]).then(v => { if (v && v !== 'delete') { r.text = v.text; r.lvl = Math.max(2, Math.round(v.lvl)); save(); render(); } }); }
  if (b.dataset.rdel) { D.rewards = D.rewards.filter(x => x.id !== b.dataset.rdel); save(); render(); }
});
(async () => { D = await Store.get('gewohnheiten', D); render(); })();
</script>
</body></html>
